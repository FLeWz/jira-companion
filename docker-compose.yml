services:
  jira-companion:
    build: .
    image: jira-companion
    container_name: jira-companion
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # localhost only: never bind to 0.0.0.0
      - "127.0.0.1:8080:8080"
    volumes:
      - jira-companion-data:/data

volumes:
  jira-companion-data:
